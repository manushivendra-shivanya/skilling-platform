name: Build Candidate Mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/flutter-foundation
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/candidate-mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: candidate-mobile-debug-apk
          path: apps/candidate-mobile/build/app/outputs/flutter-apk/app-debug.apk
