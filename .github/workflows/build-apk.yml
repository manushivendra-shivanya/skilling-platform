name: Build Candidate Mobile APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Publish the APK as a GitHub release under this tag
          (e.g. v0.1.0-home-redesign). Leave blank to only upload a
          build artifact.
        required: false
        default: ''
      release_name:
        description: 'Title for the release. Defaults to the tag.'
        required: false
        default: ''
      # One-off overrides for a manual build. Repository variables are the
      # durable home for these -- anything passed here is recorded in this
      # run's metadata, and has to be re-entered on every later build. Only
      # ever pass values that already ship inside the APK and are public by
      # design: the Supabase publishable key (safe with RLS on, which every
      # table has), the OAuth *web* client ID, and the two base URLs. Never
      # an sb_secret_/service_role key or an OAuth client secret.
      supabase_url:
        description: 'Override SUPABASE_URL (else repo secret/variable).'
        required: false
        default: ''
      supabase_publishable_key:
        description: 'Override SUPABASE_PUBLISHABLE_KEY. Publishable/anon key only.'
        required: false
        default: ''
      api_base_url:
        description: 'Override API_BASE_URL, including /v1.'
        required: false
        default: ''
      google_web_client_id:
        description: 'Override GOOGLE_WEB_CLIENT_ID. Web application client ID.'
        required: false
        default: ''
  # Was `push: branches: [feature/flutter-foundation, main]` -- every ordinary
  # merge to main triggered a full native Android build on a GitHub-hosted
  # runner, which is exactly what exhausted this account's included Actions
  # minutes. workflow_dispatch already covers "build me an APK right now"
  # (with a release_tag to publish it); a tag push covers "cut a review
  # build for this point in history" without spending minutes on every
  # routine feature-branch merge. Revert to the branch-push trigger above if
  # every main push should build automatically again.
  push:
    tags:
      - 'v*'

jobs:
  build:
    # Was `runs-on: ubuntu-latest`. GitHub only meters GitHub-hosted
    # runners against the account's included Actions minutes -- a
    # self-hosted runner's time is free regardless of how long it takes.
    # scripts/ci/setup-mac-runner.sh registers a Mac with exactly these
    # labels. If no matching runner is online, the job sits queued (visible
    # under the Actions tab, cancel it manually if needed) rather than
    # failing outright -- GitHub has no built-in queue timeout. Revert to
    # `ubuntu-latest` once the Actions minutes quota resets (2026-09-01) or
    # affording GitHub-hosted overage stops being a concern.
    runs-on: [self-hosted, macOS]
    # Was 30. Two consecutive runs (2026-08-14) were killed by this timeout
    # at 30m40s and 30m49s -- not a manual cancel or a flaky runner, the job
    # itself: `subosito/flutter-action@v2`'s `cache: true` isn't hitting on
    # this self-hosted Mac runner, so Flutter SDK setup alone took ~16
    # minutes both times, and `flutter test` (fast locally, under 2 minutes)
    # took another ~11-12 minutes on this runner. That's ~27-28 minutes gone
    # before the job ever reaches the actual APK build, signing, and
    # release-publish steps. 60 gives real headroom for setup + test + build
    # + publish even on a cold cache; revisit downward once the Flutter SDK
    # cache is confirmed to actually persist across runs on this runner.
    timeout-minutes: 60

    # Needed only by the release step below; pushes never reach it.
    permissions:
      contents: write

    defaults:
      run:
        working-directory: apps/candidate-mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Pinned, not `channel: stable` -- that floated to whatever Flutter
      # release was current on the runner that day (3.47.0 at the time this
      # was pinned), which had already drifted from the 3.44.9 every
      # contributor and CI-adjacent tooling in this repo develops against.
      # The drift wasn't cosmetic: a newer Dart SDK re-resolved 5 pub
      # dependencies away from the committed pubspec.lock and, with them,
      # started flagging `unawaited_return_in_try_block` in
      # jobs_controller.dart -- a warning `flutter analyze` never produces
      # on 3.44.9, and `flutter analyze` fails the whole job on any warning.
      # Every push-triggered run for hours failed at this exact step, before
      # Android compilation ever started. Bump this version deliberately,
      # in its own commit, when the team's pinned Flutter version changes --
      # never let it float again.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      # A build missing these dart-defines still compiles and installs -- it
      # just silently comes up with no Supabase, no API and no Google Sign-In,
      # because AppConfig gates each feature on its value being present
      # (lib/core/config/app_environment.dart). That is exactly how a review
      # APK shipped with Jobs empty and Google Sign-In hidden. Fail loudly
      # instead, at least for anything published for someone to install.
      - name: Check app configuration
        env:
          SUPABASE_URL: ${{ inputs.supabase_url || secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ inputs.supabase_publishable_key || secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
          API_BASE_URL: ${{ inputs.api_base_url || secrets.API_BASE_URL || vars.API_BASE_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ inputs.google_web_client_id || secrets.GOOGLE_WEB_CLIENT_ID || vars.GOOGLE_WEB_CLIENT_ID }}
          PUBLISHING: ${{ inputs.release_tag != '' }}
        run: |
          set -euo pipefail
          missing=()
          for var in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY API_BASE_URL GOOGLE_WEB_CLIENT_ID; do
            [ -z "${!var:-}" ] && missing+=("$var")
          done

          if [ ${#missing[@]} -eq 0 ]; then
            echo "All app configuration present."
            exit 0
          fi

          echo "Missing configuration: ${missing[*]}" >&2
          echo "Set them under Settings -> Secrets and variables -> Actions." >&2

          if [ "$PUBLISHING" = "true" ]; then
            echo "Refusing to publish an installable APK with features silently off." >&2
            exit 1
          fi
          echo "::warning::Building without ${missing[*]} -- those features will be unavailable."

      # Without a fixed keystore every run signs with a different fingerprint,
      # which can never be registered against the Android OAuth client -- so
      # Google Sign-In cannot work on a CI build. Decoding this secret gives
      # review builds one stable identity to register. Optional: absent it the
      # build still succeeds, just with Google Sign-In unavailable.
      - name: Restore review signing keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.FLORA_REVIEW_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::warning::FLORA_REVIEW_KEYSTORE_B64 not set -- signing with a throwaway debug keystore, so Google Sign-In will not work in this build."
            exit 0
          fi
          path="$RUNNER_TEMP/flora-review.keystore"
          # GNU coreutils base64 (every GitHub-hosted Linux runner) decodes
          # with `-d`. Apple's own /usr/bin/base64 on macOS (the
          # self-hosted runner) has no -d at all -- only -D -- and fails
          # with an unrecognized-option error instead of silently doing the
          # wrong thing, which is at least loud, but still breaks the
          # step. $RUNNER_OS is set by Actions itself, not uname, so this
          # doesn't depend on how any given shell reports the platform.
          if [ "$RUNNER_OS" = "macOS" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -D > "$path"
          else
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$path"
          fi
          echo "FLORA_REVIEW_KEYSTORE=$path" >> "$GITHUB_ENV"
          echo "restored review keystore"

      # MICRO_LESSON_CDN_BASE_URL is the public r2.dev URL for the
      # flora-micro-lessons bucket -- not a secret, it's meant to be
      # publicly reachable. Clips with a cloudflareVideoPath resolve to
      # this CDN; clips without one keep using their bundled local asset.
      - name: Build debug APK
        env:
          FLORA_REVIEW_KEYSTORE_PASSWORD: ${{ secrets.FLORA_REVIEW_KEYSTORE_PASSWORD }}
          FLORA_REVIEW_KEY_ALIAS: ${{ secrets.FLORA_REVIEW_KEY_ALIAS }}
          FLORA_REVIEW_KEY_PASSWORD: ${{ secrets.FLORA_REVIEW_KEY_PASSWORD }}
          SUPABASE_URL: ${{ inputs.supabase_url || secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ inputs.supabase_publishable_key || secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
          API_BASE_URL: ${{ inputs.api_base_url || secrets.API_BASE_URL || vars.API_BASE_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ inputs.google_web_client_id || secrets.GOOGLE_WEB_CLIENT_ID || vars.GOOGLE_WEB_CLIENT_ID }}
          MICRO_LESSON_CDN_BASE_URL: ${{ vars.MICRO_LESSON_CDN_BASE_URL || 'https://pub-968107cb08f34b87b748a3700b60843e.r2.dev' }}
        run: >-
          flutter build apk --debug
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          --dart-define=API_BASE_URL="$API_BASE_URL"
          --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"
          --dart-define=MICRO_LESSON_CDN_BASE_URL="$MICRO_LESSON_CDN_BASE_URL"

      # Google checks the signing certificate's SHA-1 against the Android
      # OAuth client, and Gradle generates a fresh debug keystore on any
      # machine that lacks one -- so every CI run signs with a different
      # fingerprint than a developer's laptop does. Print it: when Google
      # Sign-In fails on a CI build, the first question is always whether
      # this value is registered, and otherwise there is no way to find out.
      - name: Report signing fingerprint
        if: always()
        env:
          KEYSTORE_PASSWORD: ${{ secrets.FLORA_REVIEW_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FLORA_REVIEW_KEY_ALIAS }}
        run: |
          set -euo pipefail
          # Report whichever key actually signed this APK: the stable review
          # keystore when one was restored, otherwise the throwaway debug one.
          if [ -n "${FLORA_REVIEW_KEYSTORE:-}" ] && [ -f "$FLORA_REVIEW_KEYSTORE" ]; then
            keystore="$FLORA_REVIEW_KEYSTORE"
            alias="${KEY_ALIAS:-flora-review}"
            storepass="${KEYSTORE_PASSWORD:-}"
            kind="review keystore (stable)"
          else
            keystore="$HOME/.android/debug.keystore"
            alias="androiddebugkey"
            storepass="android"
            kind="throwaway debug keystore -- changes every run"
          fi
          if [ ! -f "$keystore" ]; then
            echo "No keystore at $keystore -- build did not reach signing."
            exit 0
          fi
          # `\s` is a GNU/PCRE extension, not POSIX ERE -- GNU grep/sed
          # (GitHub-hosted Linux) accept it, but there's no guarantee BSD
          # grep/sed (macOS, the self-hosted runner) parses it the same
          # way. `[[:space:]]` is the POSIX character class every `-E`
          # implementation actually has to support, on either OS.
          sha1=$(keytool -list -v -keystore "$keystore" \
            -alias "$alias" -storepass "$storepass" 2>/dev/null \
            | grep -E '^[[:space:]]*SHA1:' | head -1 \
            | sed -E 's/.*SHA1:[[:space:]]*//')
          echo "signed with: $kind"
          {
            echo "### Signing fingerprint"
            echo ""
            echo "Package: \`com.example.candidate_mobile\`"
            echo "SHA-1: \`${sha1}\`"
            echo ""
            echo "Signed with: ${kind}"
            echo ""
            echo "Google Sign-In only works if this exact SHA-1 is registered"
            echo "against that package in an **Android** OAuth client in Google"
            echo "Cloud Console."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "signing SHA-1: $sha1"

      # No `retention-days` here used to mean the GitHub default: 90 days.
      # Every run of this workflow uploads one of these unconditionally
      # (release publishing below is opt-in via `release_tag`, this isn't),
      # and a debug APK is tens of MB -- across the many runs this repo has
      # accumulated, that quietly ate the account's entire 500MB Actions
      # storage quota (separate from, and in addition to, the included
      # Actions *minutes* quota exhausted earlier). A published release
      # asset (the "Publish APK as a release asset" step below) already
      # gives testers a durable, plain download URL and does NOT count
      # against this quota -- so this artifact only ever needs to survive
      # long enough to grab a build's output for a quick look before the
      # next run replaces it, not 90 days.
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-mobile-debug-apk
          path: apps/candidate-mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3

      # An upload-artifact zip needs a GitHub login and expires. A release
      # asset has a plain download URL a tester can open on their phone,
      # which is the point of building an APK for review at all.
      - name: Publish APK as a release asset
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          TITLE: ${{ inputs.release_name }}
        run: |
          set -euo pipefail
          asset="flora-candidate-app-${TAG}.apk"
          cp build/app/outputs/flutter-apk/app-debug.apk "$asset"

          # Debug signing keys: installable for review, not Play-ready.
          notes=$(printf '%s\n' \
            "Debug APK built from \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA}\`." \
            "" \
            "Signed with debug keys — install for review only, not for distribution." \
            "Enable \"install from unknown sources\" on the device first.")

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$asset" --clobber
          else
            gh release create "$TAG" "$asset" \
              --target "$GITHUB_SHA" \
              --title "${TITLE:-$TAG}" \
              --notes "$notes" \
              --prerelease
          fi

          echo "Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
