name: candidate_mobile
description: Candidate mobile application for the skilling and employment platform.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.0
  dio: ^5.9.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  supabase_flutter: ^2.10.0
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  record: ^7.1.1
  intl: ^0.20.2
  webview_flutter: ^4.14.1
  video_player: ^2.13.0
  url_launcher: ^6.3.2
  google_sign_in: ^7.2.0
  shimmer: ^3.0.0
  # Resume upload (PDF / Word). Uses the platform's own document picker,
  # which needs no storage permission on Android -- the system UI hands
  # back a single file the candidate explicitly chose, rather than the app
  # gaining access to their files.
  #
  # Floor is 11, not 8: file_picker 8.3.7 hardcodes `compileSdk 34` in its
  # own android/build.gradle while pulling in
  # flutter_plugin_android_lifecycle, which requires 36 -- so
  # `:file_picker:checkDebugAarMetadata` fails the APK build outright, no
  # matter that this app already compiles against 36. From 11 the plugin
  # reads `flutter.compileSdkVersion` and inherits ours. `minSdk 21` is
  # unchanged between the two, so no device loses support.
  #
  # Not 12 yet: file_picker 12 pulls in windows_file_picker, which needs
  # win32 ^6, while flutter_secure_storage 9.2.4 pins win32 ^5. Moving to
  # 12 means upgrading flutter_secure_storage first -- for a Windows-only
  # transitive dependency this app never builds for.
  file_picker: ^11.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^3.1.0
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true

  # Enables `flutter gen-l10n`, configured via l10n.yaml at the repo root --
  # generates lib/l10n/generated/app_localizations.dart from
  # lib/l10n/app_*.arb automatically on every `flutter pub get` / `analyze`
  # / `test` / `build`. Real ARB-based localization, not a hand-rolled
  # per-screen switch: MaterialApp reads the candidate's saved language
  # preference (already collected at onboarding -- see
  # `languageSelectionControllerProvider`) and every localized string comes
  # from AppLocalizations.of(context) instead of being hardcoded per screen.
  generate: true

  assets:
    - assets/micro_lessons/
    - assets/micro_lessons/videos/
    - assets/micro_lessons/thumbnails/
    - assets/certification_exam/
    - assets/workplace_simulation/logistics/
    - assets/wms_3d/
    - assets/wms_3d/models/
    - assets/wms_3d/textures/

  # Sector-pack typography (docs/adr/0020-sector-pack-abstraction.md). Family
  # names are prefixed "Sector " and used ONLY inside
  # lib/features/sector_pack/presentation/ -- never registered in
  # app_theme.dart's global textTheme. A single-weight subset relative to the
  # published Shift Floor mock (see docs/26-sector-pack-rollout.md): Big
  # Shoulders 800 only, IBM Plex Sans 400/600/700, IBM Plex Mono 500. All
  # three are open-source (Big Shoulders Display: Google Fonts / SIL OFL;
  # IBM Plex: IBM / SIL OFL).
  fonts:
    - family: Sector Big Shoulders
      fonts:
        - asset: assets/fonts/BigShoulders-ExtraBold.ttf
          weight: 800
    - family: Sector IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: Sector IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
